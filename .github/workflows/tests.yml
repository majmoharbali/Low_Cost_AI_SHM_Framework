name: Numerical and smoke checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -c review/environment-freeze.txt -r requirements-dev.txt -r requirements-legacy.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m src.main_simulation --legacy --smoke
      - run: python -m src.train_model --legacy --smoke
      - run: python -m src.verify_mechanics --output outputs/verification.json
